[package]
name = "meroa"
version = "0.3.0"
description = "A local, tray-first Codex quota companion"
authors = ["MEROA"]
edition = "2021"

[lib]
name = "meroa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["native-tls", "system-proxy"] }
semver = "1"
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
