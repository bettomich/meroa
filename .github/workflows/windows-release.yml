name: Windows release foundation

on:
  workflow_dispatch:
    inputs:
      sign_artifacts:
        description: Build signed NSIS artifacts without publishing a release
        required: true
        type: boolean
        default: false
      publish_release:
        description: Create a draft GitHub Release after validation
        required: true
        type: boolean
        default: false
      release_tag:
        description: Required for publication; use release/vX.Y.Z when running from a release tag
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-signing-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source without signing material
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Validate release request
        shell: pwsh
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REF_TYPE: ${{ github.ref_type }}
          WORKFLOW_REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:PUBLISH_RELEASE -ne "true") { exit 0 }

          $isMain = $env:WORKFLOW_REF -eq "refs/heads/main"
          $isApprovedReleaseTag = $env:WORKFLOW_REF_TYPE -eq "tag" -and $env:WORKFLOW_REF_NAME -like "release/*"
          if (-not ($isMain -or $isApprovedReleaseTag)) {
            throw "Publication is allowed only from main or from a release/* tag."
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) {
            throw "release_tag is required when publish_release is enabled."
          }
          if ($isApprovedReleaseTag -and $env:RELEASE_TAG -ne $env:WORKFLOW_REF_NAME) {
            throw "release_tag must exactly match the selected release/* tag."
          }

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Check Rust application
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

  sign-windows-x64:
    name: Sign Windows x64 artifacts
    needs: verify
    if: ${{ inputs.sign_artifacts && !inputs.publish_release }}
    runs-on: windows-latest
    environment:
      name: release-signing
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build signed NSIS updater artifacts
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY environment secret."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD environment secret."
          }
          npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Store signed artifacts in this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: meroa-windows-x64-signed
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig

  publish-release:
    name: Create draft release
    needs: verify
    if: ${{ inputs.publish_release }}
    runs-on: windows-latest
    environment:
      name: release-signing
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and create a draft GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.release_tag }}
          releaseName: MEROA v__VERSION__
          releaseBody: Signed MEROA Windows x64 release candidate.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --target x86_64-pc-windows-msvc
